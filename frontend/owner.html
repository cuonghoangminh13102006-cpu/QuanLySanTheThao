<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Cổng Chủ Sân - SportBooking</title>
</head>
<body>
  <p>Đang chuyển hướng đến cổng Chủ sân...</p>
  <script>
    (function() {
      try {
        const user = JSON.parse(sessionStorage.getItem('currentUser') || 'null');
        if (!user || !user.vaiTro) {
          alert('Vui lòng đăng nhập để truy cập!');
          window.location.replace('login.html');
          return;
        }
        if (user.vaiTro !== 'Chủ sân') {
          alert('Bạn không có quyền truy cập Cổng Chủ sân!');
          if (user.vaiTro === 'Admin') {
            window.location.replace('sportbooking-html/quan-ly-tai-khoan.html');
          } else {
            window.location.replace('index.html');
          }
          return;
        }
        window.location.replace('sportbooking-html/quan-ly-san.html');
      } catch (_) {
        window.location.replace('login.html');
      }
    })();
  </script>
</body>
</html>
